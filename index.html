, criticality, lifecycle cost and renewal planning","screen resolution only","file names only"],"a":1,"e":"A digital replica can combine condition and lifecycle data to support asset renewal decisions."},{"id":733,"part":"Section 2","sec":"Integrated Mixed Review (50)","q":"Integrated review Q33: Which option is the most defensible answer for the concept 'phasing' when coordinating computer, BIM, digital-twin, IoT or GIS workflows?","o":["manages existing, demolished, new and temporary states over time","texture coordinates","GIS projections","CPU scheduling"],"a":0,"e":"Phasing supports model representation across construction/demolition stages."},{"id":734,"part":"Section 2","sec":"Integrated Mixed Review (50)","q":"Integrated review Q34: Which option is the most defensible answer for the concept 'FMEA' when coordinating computer, BIM, digital-twin, IoT or GIS workflows?","o":["Facility Model Energy Assessment","File Management Exchange Architecture","Flow Mapping Equipment Analysis","Failure Modes and Effects Analysis"],"a":3,"e":"FMEA systematically identifies failure modes, causes and effects."},{"id":735,"part":"Section 2","sec":"Integrated Mixed Review (50)","q":"Integrated review Q35: Which option is the most defensible answer for the concept 'site suitability' when coordinating computer, BIM, digital-twin, IoT or GIS workflows?","o":["render interior materials","compile software","combine multiple spatial criteria such as slope, access, flood risk and zoning","model only door families"],"a":2,"e":"GIS excels at multi-criteria spatial suitability analysis before detailed BIM design."},{"id":736,"part":"Section 2","sec":"Integrated Mixed Review (50)","q":"Integrated review Q36: Which option is the most defensible answer for the concept 'Autodesk exchange format commonly used for CAD interoperability' when coordinating computer, BIM, digital-twin, IoT or GIS workflows?","o":["PSD","DXF","DWG only","RVT"],"a":1,"e":"DXF was created by Autodesk as a Drawing Exchange Format for interoperability."},{"id":737,"part":"Section 2","sec":"Integrated Mixed Review (50)","q":"Integrated review Q37: Which option is the most defensible answer for the concept 'high-speed display interface commonly used for high-resolution/high-refresh monitors' when coordinating computer, BIM, digital-twin, IoT or GIS workflows?","o":["DisplayPort","RJ-45","SATA","PS/2"],"a":0,"e":"DisplayPort is widely used for high-resolution and high-refresh display connections."},{"id":738,"part":"Section 2","sec":"Integrated Mixed Review (50)","q":"Integrated review Q38: Which option is the most defensible answer for the concept 'normal map' when coordinating computer, BIM, digital-twin, IoT or GIS workflows?","o":["moves geometry physically","changes mesh topology directly","stores only colour","fakes small surface detail by perturbing shading normals"],"a":3,"e":"Normal maps alter the surface normal used in lighting calculations without changing geometry."},{"id":739,"part":"Section 2","sec":"Integrated Mixed Review (50)","q":"Integrated review Q39: Which option is the most defensible answer for the concept 'open standards benefit in digital twin ecosystems' when coordinating computer, BIM, digital-twin, IoT or GIS workflows?","o":["guarantee perfect data","remove need for mapping","reduce vendor lock-in and improve exchange","eliminate all governance"],"a":2,"e":"Open standards improve portability and integration, though mappings and governance remain necessary."},{"id":740,"part":"Section 2","sec":"Integrated Mixed Review (50)","q":"Integrated review Q40: Which option is the most defensible answer for the concept 'BEP purpose' when coordinating computer, BIM, digital-twin, IoT or GIS workflows?","o":["printer maintenance plan","define BIM execution strategy, roles, standards and workflows","render settings only","hardware purchase plan"],"a":1,"e":"The BIM Execution Plan establishes how BIM will be produced, exchanged and governed."},{"id":741,"part":"Section n coordinating computer, BIM, digital-twin, IoT or GIS workflows?","o":["Polar Tracking","Object Snap","Grid","Text window"],"a":0,"e":"F10 toggles Polar Tracking."},{"id":746,"part":"Section 2","sec":"Integrated Mixed Review (50)","q":"Integrated review Q46: Which option is the most defensible answer for the concept 'wildlife-hazard context use' when coordinating computer, BIM, digital-twin, IoT or GIS workflows?","o":["modify processor cache","replace radar with CAD","calculate print DPI","combine movement/environment data to assess operational risk"],"a":3,"e":"Airport twins can fuse operational and environmental data, including wildlife information, for risk assessment."},{"id":747,"part":"Section 2","sec":"Integrated Mixed Review (50)","q":"Integrated review Q47: Which option is the most defensible answer for the concept 'hard clash' when coordinating computer, BIM, digital-twin, IoT or GIS workflows?","o":["naming inconsistency","metadata typo","physical geometric intersection","clearance violation without intersection"],"a":2,"e":"Hard clashes occur when elements physically intersect."},{"id":748,"part":"Section 2","sec":"Integrated Mixed Review (50)","q":"Integrated review Q48: Which option is the most defensible answer for the concept 'data quality issue' when coordinating computer, BIM, digital-twin, IoT or GIS workflows?","o":["cannot affect predictions","missing, noisy, drifting or incorrectly calibrated sensor data","always solved by more polygons","unrelated to analytics"],"a":1,"e":"Sensor-data quality directly affects monitoring and predictive-maintenance reliability."},{"id":749,"part":"Section 2","sec":"Integrated Mixed Review (50)","q":"Integrated review Q49: Which option is the most defensible answer for the concept 'semantic interoperability' when coordinating computer, BIM, digital-twin, IoT or GIS workflows?","o":["preserve object meaning, identity, attributes and relationships, not just geometry","geometry transfer alone is sufficient","only file extension matters","only screen appearance matters"],"a":0,"e":"True interoperability retains semantics such as 'IfcWall', fire rating and material, not merely an anonymous mesh."},{"id":750,"part":"Section 2","sec":"Integrated Mixed Review (50)","q":"Integrated review Q50: Which option is the most defensible answer for the concept 'subtractive digital fabrication example' when coordinating computer, BIM, digital-twin, IoT or GIS workflows?","o":["FDM printing","SLA printing","binder jetting","CNC milling"],"a":3,"e":"CNC milling removes material and is therefore subtractive."}];
const KEY="ar-section2-750-v1";
let state={answers:{},order:DATA.map(q=>q.id),pos:0,sec:"all",mode:"all"};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.answers)state={...state,...s}}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>s; // DOM uses textContent, kept for clarity
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function qById(id){return DATA[id-1]}
function buildSections(){
 const sel=$("section"); sel.textContent="";
 const o=document.createElement("option");o.value="all";o.textContent="All topics / sections";sel.appendChild(o);
 [...new Set(DATA.map(q=>q.sec))].forEach(s=>{const op=document.createElement("option");op.value=s;op.textContent=s;sel.appendChild(op)});
 sel.value=state.sec||"all"; $("mode").value=state.mode||"all";
}
function filtered(){
 let a=state.order.map(qById).filter(Boolean);
 if(state.sec!=="all")a=a.filter(q=>q.sec===state.sec);
 if(state.mode==="unanswered")a=a.filter(q=>state.answers[q.id]===undefined);
 if(state.mode==="missed")a=a.filter(q=>state.answers[q.id]!==undefined && state.answers[q.id]!==q.a);
 return a;
}
function stats(){
 const ans=Object.entries(state.answers).length;
 let cor=0;for(const [id,a] of Object.entries(state.answers)){const q=qById(+id);if(q&&q.a===a)cor++}
 $("answered").textContent=ans;$("correct").textContent=cor;$("accuracy").textContent=ans?Math.round(cor*100/ans)+"%":"0%";
 $("bar").style.width=(ans/DATA.length*100)+"%";
}
function render(){
 const list=filtered(); $("shown").textContent=list.length; stats();
 const host=$("host"); host.textContent="";
 if(!list.length){const d=document.createElement("div");d.className="card empty";d.textContent="No questions match this filter.";host.appendChild(d);return}
 if(state.pos>=list.length)state.pos=list.length-1;if(state.pos<0)state.pos=0;
 const q=list[state.pos], chosen=state.answers[q.id];
 const card=document.createElement("div");card.className="card";
 const meta=document.createElement("div");meta.className="meta";meta.textContent=`Question ${state.pos+1} of ${list.length} • #${q.id} • ${q.sec}`;card.appendChild(meta);
 const qt=document.createElement("div");qt.className="q";qt.textContent=q.q;card.appendChild(qt);
 const opts=document.createElement("div");opts.className="options";
 q.o.forEach((txt,i)=>{
   const b=document.createElement("button");b.className="opt";
   const badge=document.createElement("span");badge.className="badge";badge.textContent=String.fromCharCode(65+i);
   const t=document.createElement("span");t.textContent=txt;b.append(badge,t);
   if(chosen!==undefined){b.disabled=true;if(i===q.a)b.classList.add("correct");if(i===chosen&&chosen!==q.a)b.classList.add("wrong")}
   b.onclick=()=>answer(q,i);opts.appendChild(b);
 }); card.appendChild(opts);
 const fb=document.createElement("div");fb.className="feedback";
 if(chosen!==undefined){
   fb.classList.add("show",chosen===q.a?"ok":"bad");
   const h=document.createElement("b");
   h.textContent=chosen===q.a?"Correct":"Incorrect. Correct answer: "+String.fromCharCode(65+q.a)+") "+q.o[q.a];
   const p=document.createElement("div");p.textContent=q.e; p.style.marginTop="6px";
   fb.append(h,p);
 } card.appendChild(fb);
 const nav=document.createElement("div");nav.className="nav";
 const prev=document.createElement("button");prev.textContent="Previous";prev.onclick=()=>{state.pos--;save();render()};
 const next=document.createElement("button");next.textContent="Next";next.className="grow";next.onclick=()=>{state.pos++;save();render()};
 prev.disabled=state.pos===0; next.disabled=state.pos===list.length-1; nav.append(prev,next);card.appendChild(nav);
 host.appendChild(card);save();
}
function answer(q,i){if(state.answers[q.id]!==undefined)return;state.answers[q.id]=i;save();render()}
$("section").onchange=e=>{state.sec=e.target.value;state.pos=0;save();render()};
$("mode").onchange=e=>{state.mode=e.target.value;state.pos=0;save();render()};
$("shuffle").onclick=()=>{for(let i=state.order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[state.order[i],state.order[j]]=[state.order[j],state.order[i]]}state.pos=0;save();render()};
$("reset").onclick=()=>{if(confirm("Reset all saved answers and progress?")){state.answers={};state.order=DATA.map(q=>q.id);state.pos=0;save();render()}};
document.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 if(["a","b","c","d","1","2","3","4"].includes(k)){
   const list=filtered(); if(!list.length)return; const q=list[state.pos]; if(state.answers[q.id]!==undefined)return;
   const i="abcd".includes(k)?"abcd".indexOf(k):parseInt(k)-1; answer(q,i);
 } else if(e.key==="ArrowRight"){const l=filtered();if(state.pos<l.length-1){state.pos++;render()}}
 else if(e.key==="ArrowLeft"){if(state.pos>0){state.pos--;render()}}
});
buildSections();render();
</script>
</body></html>
